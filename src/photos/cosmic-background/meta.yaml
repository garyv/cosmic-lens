title: Cosmic Microwave Background All-Sky Map
alt: 'All-sky Mollweide projection of the cosmic microwave background: an oval map with a deep blue–black background and mottled, multicolor fluctuations—cooler regions in dark blue to teal, warmer spots in greens, yellows and reds—forming wavy bands, streaks and speckled patches across the sky with no single focal point.'
