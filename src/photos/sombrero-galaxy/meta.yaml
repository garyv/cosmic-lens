title: Sombrero Galaxy
alt: Image of a galaxy on the black background of space. The galaxy is a very oblong, brownish yellowish disk that extends from left to right at an angle (from about 10 o’clock to 5 o’clock). Mottled dark brown patches rim the edge of the disk and are particularly prominent where they cross directly in front of the galaxy. The galaxy’s center glows white and extends above and below the disk. There are different colored dots, distant galaxies, speckled among the black background of space surrounding the galaxy. At the bottom right, there is a particularly bright foreground star with Webb’s signature diffraction spikes.
rightAscension: 12:39:59.42
declination: -11:37:23.0
camera: James Webb Space Telescope NIRCam
lightyears: 30000000
